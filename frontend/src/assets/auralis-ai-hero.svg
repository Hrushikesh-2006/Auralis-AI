<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Auralis AI voice intelligence hero artwork</title>
  <desc id="desc">A cinematic abstract interface representing voice capture, transcript intelligence, and an AI Copilot.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b18"/><stop offset="0.55" stop-color="#111b38"/><stop offset="1" stop-color="#32124d"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#645bff"/><stop offset="1" stop-color="#d54dff"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#55f4c4"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="18" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1400" height="720" rx="32" fill="url(#background)"/>
  <circle cx="1110" cy="110" r="170" fill="#7a4dff" opacity=".12" filter="url(#glow)"/>
  <circle cx="210" cy="590" r="190" fill="#23d9cb" opacity=".08" filter="url(#glow)"/>
  <path d="M0 570 C240 470 330 650 560 520 S930 320 1400 490" fill="none" stroke="#5b5cf6" stroke-width="2" opacity=".34"/>
  <path d="M0 600 C250 500 350 690 600 550 S990 380 1400 530" fill="none" stroke="#31ddc2" stroke-width="2" opacity=".25"/>
  <rect x="76" y="76" width="1248" height="568" rx="28" fill="#0a1023" fill-opacity=".64" stroke="#435078" stroke-width="2"/>
  <circle cx="142" cy="142" r="30" fill="url(#violet)"/>
  <path d="M130 142h24M142 130v24" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <text x="194" y="142" fill="#ffffff" font-family="Arial, sans-serif" font-size="34" font-weight="700">Auralis AI</text>
  <text x="194" y="174" fill="#99a6c6" font-family="Arial, sans-serif" font-size="17">Listen deeply. Understand clearly. Move forward.</text>
  <rect x="110" y="232" width="520" height="270" rx="22" fill="#111a31" stroke="#33436e"/>
  <text x="146" y="278" fill="#c687ff" font-family="Arial, sans-serif" font-size="21" font-weight="700">VOICE INTELLIGENCE</text>
  <text x="146" y="322" fill="#f5f7ff" font-family="Arial, sans-serif" font-size="28" font-weight="700">From conversation</text>
  <text x="146" y="360" fill="#f5f7ff" font-family="Arial, sans-serif" font-size="28" font-weight="700">to useful insight.</text>
  <g stroke="url(#cyan)" stroke-width="6" stroke-linecap="round" opacity=".92">
    <path d="M150 422v28M174 404v64M198 386v100M222 414v44M246 394v84M270 422v28M294 402v68M318 386v100M342 414v44M366 398v76M390 422v28"/>
  </g>
  <rect x="694" y="232" width="576" height="270" rx="22" fill="#15152f" stroke="#5c4d9e"/>
  <rect x="730" y="268" width="182" height="38" rx="19" fill="#242753"/><circle cx="754" cy="287" r="7" fill="#42e5b9"/><text x="774" y="294" fill="#73f0ca" font-family="Arial, sans-serif" font-size="15" font-weight="700">JARVIS ACTIVE</text>
  <text x="730" y="354" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Ask anything about</text>
  <text x="730" y="386" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" font-weight="700">your meetings and ideas.</text>
  <rect x="730" y="423" width="430" height="12" rx="6" fill="#2c3659"/><rect x="730" y="423" width="274" height="12" rx="6" fill="url(#violet)"/>
  <circle cx="1182" cy="430" r="26" fill="url(#violet)"/><path d="M1171 430h22M1182 419v22" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <text x="110" y="588" fill="#7f8eb5" font-family="Arial, sans-serif" font-size="16">MEETING RECORDING  •  TRANSCRIPT  •  RAG COPILOT  •  DOCUMENT NARRATION</text>
