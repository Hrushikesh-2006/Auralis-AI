<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Auralis AI document narration studio</title><desc id="desc">A document and image upload screen with an audiobook player.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#090d1c"/><stop offset="1" stop-color="#27133f"/></linearGradient><linearGradient id="p"><stop stop-color="#715eff"/><stop offset="1" stop-color="#bd4cff"/></linearGradient></defs><rect width="1200" height="680" rx="24" fill="url(#bg)"/><rect x="36" y="34" width="1128" height="80" rx="20" fill="#111629" stroke="#2c3761"/><text x="76" y="84" fill="#fff" font-family="Arial" font-size="26" font-weight="700">PDF Audio Books and Podcasts</text><text x="815" y="82" fill="#9dffdc" font-family="Arial" font-size="16" font-weight="700">MULTIMODAL CONTENT STUDIO</text><rect x="36" y="143" width="1128" height="170" rx="20" fill="#11182b" stroke="#514c97" stroke-dasharray="8 8"/><circle cx="600" cy="190" r="25" fill="#352b75"/><text x="462" y="247" fill="#f4f6ff" font-family="Arial" font-size="24" font-weight="700">Upload PDF, notes, code, images, or slides</text><text x="400" y="281" fill="#9ba6c6" font-family="Arial" font-size="16">The AI understands the content and turns it into a spoken explanation.</text><rect x="36" y="345" width="790" height="280" rx="20" fill="#24184a" stroke="#584897"/><text x="70" y="393" fill="#d184ff" font-family="Arial" font-size="17" font-weight="700">NOW PLAYING AI NARRATOR</text><text x="70" y="442" fill="#fff" font-family="Arial" font-size="27" font-weight="700">Project brief: Voice FAQ Bot</text><text x="70" y="480" fill="#d3d5ee" font-family="Arial" font-size="17">A clear walkthrough of the subject, workflow,</text><text x="70" y="508" fill="#d3d5ee" font-family="Arial" font-size="17">important ideas, and practical next steps.</text><rect x="70" y="548" width="670" height="9" rx="4" fill="#d8d9ed"/><circle cx="70" cy="552" r="15" fill="url(#p)"/><rect x="870" y="345" width="294" height="280" rx="20" fill="#11182b" stroke="#303b68"/><text x="902" y="393" fill="#74ebd0" font-family="Arial" font-size="20" font-weight="700">Narration sections</text><text x="902" y="445" fill="#fff" font-family="Arial" font-size="16">Introduction</text><text x="902" y="490" fill="#fff" font-family="Arial" font-size="16">Core insights</text><text x="902" y="535" fill="#fff" font-family="Arial" font-size="16">Deep explanation</text><text x="902" y="580" fill="#fff" font-family="Arial" font-size="16">Conclusion</text></svg>