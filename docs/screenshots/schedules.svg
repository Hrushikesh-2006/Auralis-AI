<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Auralis AI schedules and voice alarms</title>
  <desc id="desc">A dark scheduling workspace with a meeting form and saved voice alarm cards.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a0e1e"/><stop offset="1" stop-color="#2c1649"/></linearGradient><linearGradient id="purple"><stop stop-color="#695cf8"/><stop offset="1" stop-color="#b64dff"/></linearGradient></defs>
  <rect width="1200" height="680" rx="24" fill="url(#bg)"/><rect x="30" y="28" width="1140" height="78" rx="18" fill="#101629" stroke="#2d375c"/>
  <circle cx="72" cy="67" r="24" fill="url(#purple)"/><text x="112" y="62" fill="#fff" font-family="Arial" font-size="25" font-weight="700">Auralis AI</text><text x="112" y="84" fill="#8794b7" font-family="Arial" font-size="14">Meeting intelligence and spoken schedule alarms</text><rect x="465" y="46" width="190" height="42" rx="12" fill="url(#purple)"/><text x="497" y="72" fill="#fff" font-family="Arial" font-size="16" font-weight="700">Schedules and Voice Alarms</text><text x="1020" y="72" fill="#50e7bb" font-family="Arial" font-size="15" font-weight="700">Jarvis Listening</text>
  <rect x="30" y="132" width="390" height="500" rx="22" fill="#121a2e" stroke="#303d6c"/><circle cx="76" cy="180" r="22" fill="url(#purple)"/><text x="112" y="184" fill="#fff" font-family="Arial" font-size="23" font-weight="700">Schedule a Meeting</text><text x="62" y="235" fill="#9aa6c6" font-family="Arial" font-size="14" font-weight="700">MEETING TITLE</text><rect x="62" y="250" width="326" height="48" rx="12" fill="#080e1d"/><text x="82" y="280" fill="#6f7b9d" font-family="Arial" font-size="15">e.g. Product Architecture Review</text><text x="62" y="340" fill="#9aa6c6" font-family="Arial" font-size="14" font-weight="700">DATE AND START TIME</text><rect x="62" y="355" width="326" height="48" rx="12" fill="#080e1d"/><text x="82" y="385" fill="#f4f6ff" font-family="Arial" font-size="15">15-09-2026  16:03</text><text x="62" y="445" fill="#9aa6c6" font-family="Arial" font-size="14" font-weight="700">REMIND ME BEFORE</text><rect x="62" y="460" width="326" height="48" rx="12" fill="#080e1d" stroke="#654ff5"/><text x="82" y="490" fill="#f4f6ff" font-family="Arial" font-size="15">1 minute before</text><rect x="62" y="550" width="326" height="48" rx="12" fill="url(#purple)"/><text x="154" y="581" fill="#fff" font-family="Arial" font-size="17" font-weight="700">Create Schedule</text>
  <rect x="452" y="132" width="718" height="500" rx="22" fill="#11182b" stroke="#303d6c"/><text x="488" y="184" fill="#f5f7ff" font-family="Arial" font-size="25" font-weight="700">Your Meeting Calendar and Alarms</text><text x="488" y="214" fill="#8794b7" font-family="Arial" font-size="15">3 saved schedules</text><rect x="1030" y="160" width="105" height="36" rx="10" fill="#242a42"/><text x="1053" y="183" fill="#d6d9ec" font-family="Arial" font-size="13" font-weight="700">Refresh List</text>
  <g><rect x="488" y="247" width="646" height="96" rx="16" fill="#1a203a" stroke="#5d54df"/><circle cx="526" cy="295" r="20" fill="#113c4a"/><text x="564" y="282" fill="#fff" font-family="Arial" font-size="18" font-weight="700">Zoom meeting Outskill class</text><rect x="834" y="263" width="147" height="26" rx="13" fill="#155345"/><text x="852" y="281" fill="#51e5bc" font-family="Arial" font-size="11" font-weight="700">STARTED AND REMINDED</text><text x="564" y="308" fill="#9da8c6" font-family="Arial" font-size="14">Sep 13, 2026, 5:24 PM</text><text x="564" y="331" fill="#ba73ff" font-family="Arial" font-size="13">Alarm: 1 minute before</text><rect x="1000" y="274" width="112" height="38" rx="10" fill="#292344"/><text x="1017" y="298" fill="#c477ff" font-family="Arial" font-size="13" font-weight="700">Speak Reminder</text></g>
  <g><rect x="488" y="365" width="646" height="96" rx="16" fill="#1a203a" stroke="#5d54df"/><circle cx="526" cy="413" r="20" fill="#113c4a"/><text x="564" y="400" fill="#fff" font-family="Arial" font-size="18" font-weight="700">Product architecture review</text><rect x="834" y="381" width="147" height="26" rx="13" fill="#155345"/><text x="852" y="399" fill="#51e5bc" font-family="Arial" font-size="11" font-weight="700">STARTED AND REMINDED</text><text x="564" y="426" fill="#9da8c6" font-family="Arial" font-size="14">Sep 15, 2026, 3:38 PM</text><text x="564" y="449" fill="#ba73ff" font-family="Arial" font-size="13">Alarm: 1 minute before</text><rect x="1000" y="392" width="112" height="38" rx="10" fill="#292344"/><text x="1017" y="416" fill="#c477ff" font-family="Arial" font-size="13" font-weight="700">Speak Reminder</text></g>
  <g><rect x="488" y="483" width="646" height="96" rx="16" fill="#1a203a" stroke="#5d54df"/><circle cx="526" cy="531" r="20" fill="#113c4a"/><text x="564" y="518" fill="#fff" font-family="Arial" font-size="18" font-weight="700">Team sync and delivery check-in</text><rect x="834" y="499" width="147" height="26" rx="13" fill="#155345"/><text x="852" y="517" fill="#51e5bc" font-family="Arial" font-size="11" font-weight="700">UPCOMING ALARM</text><text x="564" y="544" fill="#9da8c6" font-family="Arial" font-size="14">Sep 16, 2026, 10:00 AM</text><text x="564" y="567" fill="#ba73ff" font-family="Arial" font-size="13">Alarm: 5 minutes before</text><rect x="1000" y="510" width="112" height="38" rx="10" fill="#292344"/><text x="1017" y="534" fill="#c477ff" font-family="Arial" font-size="13" font-weight="700">Speak Reminder</text></g>
