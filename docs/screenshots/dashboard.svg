<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Auralis AI meeting insights dashboard</title><desc id="desc">A dark meeting intelligence dashboard with summary, decisions, action items, and transcript panels.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#090d1c"/><stop offset="1" stop-color="#24164a"/></linearGradient><linearGradient id="accent"><stop stop-color="#6d5dfc"/><stop offset="1" stop-color="#b24cff"/></linearGradient></defs>
  <rect width="1200" height="680" rx="24" fill="url(#bg)"/><rect x="28" y="26" width="1144" height="74" rx="18" fill="#101527" stroke="#293252"/>
  <circle cx="70" cy="63" r="22" fill="url(#accent)"/><text x="108" y="61" fill="#fff" font-family="Arial" font-size="24" font-weight="700">Auralis AI</text><text x="108" y="82" fill="#8993b5" font-family="Arial" font-size="13">Meeting intelligence workspace</text>
  <rect x="410" y="42" width="185" height="42" rx="12" fill="url(#accent)"/><text x="443" y="68" fill="#fff" font-family="Arial" font-size="16" font-weight="700">Insights Dashboard</text><text x="1010" y="68" fill="#39e0ae" font-family="Arial" font-size="15" font-weight="700">Jarvis Listening</text>
  <rect x="28" y="126" width="735" height="225" rx="20" fill="#11182b" stroke="#303b68"/><text x="55" y="170" fill="#c580ff" font-family="Arial" font-size="25" font-weight="700">Executive Summary</text><text x="55" y="214" fill="#f5f7ff" font-family="Arial" font-size="19">Turn a full conversation into a clear, useful brief.</text><text x="55" y="254" fill="#aeb8d6" font-family="Arial" font-size="16">Auralis identifies the main themes, decisions, owners,</text><text x="55" y="280" fill="#aeb8d6" font-family="Arial" font-size="16">and next steps while keeping the original audio searchable.</text><rect x="55" y="310" width="185" height="12" rx="6" fill="#6255ee"/><rect x="255" y="310" width="120" height="12" rx="6" fill="#20d6a1"/><rect x="390" y="310" width="150" height="12" rx="6" fill="#f04f7c"/>
  <rect x="785" y="126" width="387" height="225" rx="20" fill="#11182b" stroke="#303b68"/><text x="815" y="170" fill="#4ee5c0" font-family="Arial" font-size="22" font-weight="700">Diarized Transcript</text><text x="815" y="216" fill="#fff" font-family="Arial" font-size="15">Speaker 1  00:08</text><text x="815" y="241" fill="#9ea9c9" font-family="Arial" font-size="15">We aligned on the delivery plan...</text><text x="815" y="282" fill="#fff" font-family="Arial" font-size="15">Speaker 2  00:21</text><text x="815" y="307" fill="#9ea9c9" font-family="Arial" font-size="15">The architecture decision is confirmed.</text>
  <rect x="28" y="380" width="555" height="245" rx="20" fill="#11182b" stroke="#303b68"/><text x="55" y="425" fill="#33e3c0" font-family="Arial" font-size="22" font-weight="700">Confirmed Decisions</text><text x="55" y="475" fill="#f4f6ff" font-family="Arial" font-size="17">Adopt PostgreSQL with Redis caching</text><text x="55" y="520" fill="#f4f6ff" font-family="Arial" font-size="17">Ship the audio capture workflow this week</text><text x="55" y="565" fill="#8793b8" font-family="Arial" font-size="15">Every insight stays connected to the conversation.</text>
  <rect x="610" y="380" width="562" height="245" rx="20" fill="#11182b" stroke="#303b68"/><text x="638" y="425" fill="#ff527d" font-family="Arial" font-size="22" font-weight="700">Action Items and Assignments</text><text x="638" y="475" fill="#f4f6ff" font-family="Arial" font-size="17">Create wireframes for the Copilot workflow</text><text x="638" y="520" fill="#f4f6ff" font-family="Arial" font-size="17">Validate the production deployment checklist</text><text x="638" y="565" fill="#8793b8" font-family="Arial" font-size="15">Listen, understand, and move forward.</text>
</svg>