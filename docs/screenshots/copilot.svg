<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Auralis AI floating voice Copilot</title><desc id="desc">A floating Jarvis Copilot over a meeting dashboard.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080d1b"/><stop offset="1" stop-color="#30124b"/></linearGradient><linearGradient id="a"><stop stop-color="#6258ff"/><stop offset="1" stop-color="#c54cff"/></linearGradient></defs><rect width="1200" height="680" rx="24" fill="url(#bg)"/><rect x="34" y="38" width="710" height="590" rx="24" fill="#10172a" stroke="#29355f"/><text x="72" y="93" fill="#f5f7ff" font-family="Arial" font-size="27" font-weight="700">Live meeting workspace</text><text x="72" y="128" fill="#8290b8" font-family="Arial" font-size="17">Keep working while Jarvis listens in the background.</text><rect x="72" y="181" width="600" height="120" rx="18" fill="#17213b"/><text x="103" y="225" fill="#c880ff" font-family="Arial" font-size="21" font-weight="700">Meeting summary ready</text><text x="103" y="263" fill="#b3beda" font-family="Arial" font-size="16">Ask for a recap, a decision, an action item, or anything else.</text><rect x="72" y="340" width="250" height="15" rx="7" fill="#6258ff"/><rect x="72" y="390" width="510" height="15" rx="7" fill="#263355"/><rect x="72" y="430" width="430" height="15" rx="7" fill="#263355"/><rect x="782" y="62" width="355" height="548" rx="26" fill="#111326" stroke="#7761ff" stroke-width="2"/><rect x="782" y="62" width="355" height="80" rx="26" fill="url(#a)"/><text x="818" y="101" fill="#fff" font-family="Arial" font-size="22" font-weight="700">Floating Voice Co-Pilot</text><text x="818" y="124" fill="#d9d7ff" font-family="Arial" font-size="13">VOICE ACTIVE</text><rect x="812" y="174" width="295" height="82" rx="16" fill="#1b2036"/><text x="836" y="207" fill="#fff" font-family="Arial" font-size="16">Hello. I am Jarvis.</text><text x="836" y="233" fill="#aeb8d6" font-family="Arial" font-size="14">Say Hey Jarvis or ask anything.</text><rect x="812" y="285" width="295" height="132" rx="16" fill="#201d42"/><text x="836" y="320" fill="#c880ff" font-family="Arial" font-size="16" font-weight="700">What did we decide?</text><text x="836" y="356" fill="#f5f7ff" font-family="Arial" font-size="15">The team approved the caching</text><text x="836" y="380" fill="#f5f7ff" font-family="Arial" font-size="15">strategy and assigned delivery owners.</text><rect x="812" y="530" width="235" height="42" rx="12" fill="#1a2139" stroke="#394876"/><text x="830" y="557" fill="#8997bd" font-family="Arial" font-size="14">Ask Jarvis anything...</text><circle cx="1070" cy="551" r="22" fill="url(#a)"/></svg>